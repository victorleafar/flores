<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¡Aquí están tus flores amarillas!</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@600;700;900&family=Montserrat:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #050401;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
        }

        .font-cinzel {
            font-family: 'Cinzel Decorative', serif;
        }

        .font-script {
            font-family: 'Pinyon Script', cursive;
        }

        /* Glassmorphism Panel with Golden Glow Border */
        .glass-panel {
            background: rgba(18, 12, 4, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.35);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 200, 0, 0.12);
        }

        /* Golden Gradient Text effect */
        .gold-glow-text {
            background: linear-gradient(135deg, #FFFFFF 0%, #FFF3A1 25%, #FFD700 60%, #FFA500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
        }

        /* Glowing Action Buttons */
        .glow-button {
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2), inset 0 0 12px rgba(255, 215, 0, 0.15);
        }

        .glow-button:hover, .glow-button:active {
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.4);
            transform: translateY(-2px) scale(1.02);
        }

        /* Ambient background glow */
        .sunlight-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 190, 0, 0.12) 0%, rgba(255, 120, 0, 0.03) 50%, rgba(0,0,0,0) 80%);
            pointer-events: none;
            z-index: 0;
        }

        /* Strict Flexbox Main Layout Structure */
        .main-layout {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* Header (Flex Shrink 0) */
        .header-section {
            flex-shrink: 0;
            width: 100%;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        /* Middle Viewport (Flex Grow 1, strictly holds canvas) */
        .canvas-section {
            flex-grow: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
            z-index: 10;
        }

        #webgl-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* Footer (Flex Shrink 0) */
        .footer-section {
            flex-shrink: 0;
            width: 100%;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            z-index: 20;
        }
    </style>
</head>
<body class="select-none">

    <!-- Ambient Glow Background -->
    <div class="sunlight-glow"></div>

    <!-- Strict 3-Tier Flexbox Layout -->
    <div class="main-layout">
        
        <!-- TOP TIER: Header Section -->
        <header class="header-section">
            <div id="header-card" class="glass-panel px-6 py-3.5 sm:px-10 sm:py-5 rounded-3xl text-center max-w-lg w-full transition-all duration-1000 opacity-0 -translate-y-4">
                <span class="font-script text-xl sm:text-2xl text-amber-200 block mb-0.5">Especialmente para ti</span>
                <h1 class="font-cinzel text-lg sm:text-2xl md:text-3xl font-bold gold-glow-text leading-tight tracking-wide">
                    ¡Aquí están tus flores amarillas!
                </h1>
                <div class="w-12 h-[1px] bg-gradient-to-r from-transparent via-amber-400 to-transparent mx-auto my-1.5"></div>
                <p class="text-amber-100/80 text-[10px] sm:text-xs font-light tracking-widest uppercase">
                    Un girasol eterno lleno de luz y calidez
                </p>
            </div>
        </header>

        <!-- MIDDLE TIER: Dedicated 3D Canvas Section -->
        <main class="canvas-section">
            <div id="webgl-container"></div>
        </main>

        <!-- BOTTOM TIER: Footer Control Section -->
        <footer class="footer-section">
            <div class="flex flex-wrap justify-center gap-3">
                <button id="bloom-btn" class="glow-button bg-amber-500/20 hover:bg-amber-500/40 border border-amber-300/50 text-amber-100 font-medium px-6 py-2.5 rounded-full backdrop-blur-md text-xs sm:text-sm tracking-wider uppercase transition">
                    🌻 Florecer
                </button>
                <button id="light-btn" class="glow-button bg-amber-500/10 hover:bg-amber-500/30 border border-amber-400/30 text-amber-200 font-light px-5 py-2.5 rounded-full backdrop-blur-md text-xs sm:text-sm tracking-wider uppercase transition">
                    ✨ Destello Solar
                </button>
            </div>
            
            <p class="text-amber-300/60 text-[10px] font-light tracking-widest uppercase text-center bg-black/60 px-4 py-1 rounded-full backdrop-blur-sm border border-amber-500/20">
                Desliza para girar el girasol
            </p>
        </footer>

    </div>

    <script>
        window.onload = function() {
            // Animate Header Entry
            setTimeout(() => {
                const headerCard = document.getElementById('header-card');
                if (headerCard) {
                    headerCard.classList.remove('opacity-0', '-translate-y-4');
                    headerCard.classList.add('opacity-100', 'translate-y-0');
                }
            }, 200);

            // Three.js Core Setup inside middle container
            const container = document.getElementById('webgl-container');
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050401, 0.035);

            const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
            
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.25;
            container.appendChild(renderer.domElement);

            // Ambient & Accent Lights
            const ambientLight = new THREE.AmbientLight(0xfff5cc, 0.95);
            scene.add(ambientLight);

            const sunLight = new THREE.SpotLight(0xffdf00, 3.8);
            sunLight.position.set(10, 15, 10);
            sunLight.angle = Math.PI / 3.5;
            sunLight.penumbra = 0.7;
            sunLight.castShadow = true;
            scene.add(sunLight);

            const warmFill = new THREE.PointLight(0xff8c00, 2.0, 20);
            warmFill.position.set(-8, -4, 6);
            scene.add(warmFill);

            const centerGlow = new THREE.PointLight(0xffe000, 1.5, 6);
            centerGlow.position.set(0, 0, 1);
            scene.add(centerGlow);

            // 3D Sunflower Master Group
            const sunflowerGroup = new THREE.Group();
            scene.add(sunflowerGroup);

            const petals = [];

            const stemMaterial = new THREE.MeshStandardMaterial({
                color: 0x2b5419,
                roughness: 0.6,
                metalness: 0.05
            });

            const leafMaterial = new THREE.MeshStandardMaterial({
                color: 0x214713,
                roughness: 0.5,
                metalness: 0.1,
                side: THREE.DoubleSide
            });

            const seedMaterial = new THREE.MeshStandardMaterial({
                color: 0x1f1003,
                roughness: 0.85,
                metalness: 0.05
            });

            const innerSeedMaterial = new THREE.MeshStandardMaterial({
                color: 0x452508,
                roughness: 0.75,
                emissive: 0x1a0b00,
                emissiveIntensity: 0.25
            });

            const createPetalMaterial = (colorHex) => {
                return new THREE.MeshStandardMaterial({
                    color: colorHex,
                    roughness: 0.35,
                    metalness: 0.05,
                    side: THREE.DoubleSide,
                    emissive: 0x4a3200,
                    emissiveIntensity: 0.18
                });
            };

            // Fixed Smooth Stem Geometry (Single continuous CatmullRom Curve with minimal tangent sway to avoid kinks)
            const stemPoints = [
                new THREE.Vector3(0, -4.8, 0),
                new THREE.Vector3(0.08, -3.2, -0.05),
                new THREE.Vector3(0.12, -1.6, -0.08),
                new THREE.Vector3(0, 0.2, 0)
            ];
            const stemCurve = new THREE.CatmullRomCurve3(stemPoints, false, 'catmullrom', 0.5);
            const stemGeometry = new THREE.TubeGeometry(stemCurve, 128, 0.15, 24, false);
            const stemMesh = new THREE.Mesh(stemGeometry, stemMaterial);
            stemMesh.castShadow = true;
            sunflowerGroup.add(stemMesh);

            // Leaf Generator
            const createSunflowerLeaf = (isLeft = true) => {
                const shape = new THREE.Shape();
                shape.moveTo(0, 0);
                shape.bezierCurveTo(0.7, 0.5, 1.6, 1.0, 1.8, 2.2);
                shape.bezierCurveTo(1.0, 2.8, 0.2, 2.2, 0, 0);

                const leafGeo = new THREE.ExtrudeGeometry(shape, {
                    depth: 0.02,
                    bevelEnabled: true,
                    bevelSegments: 3,
                    steps: 1,
                    bevelSize: 0.02,
                    bevelThickness: 0.02
                });

                const leaf = new THREE.Mesh(leafGeo, leafMaterial);
                leaf.castShadow = true;
                if (!isLeft) leaf.scale.x = -1;
                return leaf;
            };

            const leaf1 = createSunflowerLeaf(true);
            leaf1.position.set(0.12, -1.6, -0.08);
            leaf1.rotation.set(0.2, -0.4, -0.5);
            leaf1.scale.set(0.65, 0.65, 0.65);
            sunflowerGroup.add(leaf1);

            const leaf2 = createSunflowerLeaf(false);
            leaf2.position.set(0.1, -2.8, -0.05);
            leaf2.rotation.set(-0.2, 0.5, 0.4);
            leaf2.scale.set(0.75, 0.75, 0.75);
            sunflowerGroup.add(leaf2);

            const flowerHeadGroup = new THREE.Group();
            flowerHeadGroup.position.set(0, 0.2, 0);
            sunflowerGroup.add(flowerHeadGroup);

            // Head Back Disc
            const headBackGeo = new THREE.CylinderGeometry(1.6, 1.4, 0.2, 32);
            const headBackMesh = new THREE.Mesh(headBackGeo, stemMaterial);
            headBackMesh.position.z = -0.1;
            headBackMesh.rotation.x = Math.PI / 2;
            flowerHeadGroup.add(headBackMesh);

            // Fibonacci Seed Spiral Center
            const seedCount = 360;
            const goldenAngle = Math.PI * (3 - Math.sqrt(5));
            const seedGeo = new THREE.SphereGeometry(0.05, 8, 8);
            seedGeo.scale(1, 1, 0.55);

            for (let i = 0; i < seedCount; i++) {
                const r = 0.082 * Math.sqrt(i);
                if (r > 1.55) continue;

                const theta = i * goldenAngle;
                const x = r * Math.cos(theta);
                const y = r * Math.sin(theta);
                const z = Math.cos(r * 0.8) * 0.12;

                const isInner = r < 0.65;
                const seedMesh = new THREE.Mesh(seedGeo, isInner ? innerSeedMaterial : seedMaterial);
                seedMesh.position.set(x, y, z + 0.04);
                seedMesh.rotation.set(Math.random() * 0.15, Math.random() * 0.15, theta);
                flowerHeadGroup.add(seedMesh);
            }

            const createPetalGeometry = () => {
                const shape = new THREE.Shape();
                shape.moveTo(0, 0);
                shape.bezierCurveTo(0.22, 0.5, 0.48, 1.6, 0.45, 2.8);
                shape.bezierCurveTo(0.35, 3.7, 0.12, 4.3, 0, 4.5);
                shape.bezierCurveTo(-0.12, 4.3, -0.35, 3.7, -0.45, 2.8);
                shape.bezierCurveTo(-0.48, 1.6, -0.22, 0.5, 0, 0);

                const extrudeSettings = {
                    steps: 1,
                    depth: 0.02,
                    bevelEnabled: true,
                    bevelThickness: 0.015,
                    bevelSize: 0.015,
                    bevelSegments: 3
                };

                const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
                const pos = geo.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const y = pos.getY(i);
                    const z = pos.getZ(i);
                    pos.setZ(i, z - Math.pow(y / 4.5, 2) * 0.38);
                }
                geo.computeVertexNormals();
                return geo;
            };

            const petalGeo = createPetalGeometry();

            const petalLayers = [
                { count: 28, radius: 1.48, scale: 0.52, tilt: 0.38, color: 0xFF9900, z: -0.04 },
                { count: 26, radius: 1.38, scale: 0.48, tilt: 0.28, color: 0xFFB700, z: 0.0 },
                { count: 22, radius: 1.25, scale: 0.42, tilt: 0.18, color: 0xFFD700, z: 0.04 }
            ];

            petalLayers.forEach((layer, layerIdx) => {
                const angleStep = (Math.PI * 2) / layer.count;
                const offset = (layerIdx % 2) * (angleStep / 2);

                for (let i = 0; i < layer.count; i++) {
                    const angle = i * angleStep + offset;
                    const mat = createPetalMaterial(layer.color);
                    const petalMesh = new THREE.Mesh(petalGeo, mat);
                    petalMesh.castShadow = true;

                    const pivot = new THREE.Group();
                    pivot.position.set(
                        Math.cos(angle) * layer.radius,
                        Math.sin(angle) * layer.radius,
                        layer.z
                    );
                    
                    pivot.rotation.z = angle - Math.PI / 2;
                    petalMesh.scale.set(layer.scale, layer.scale, layer.scale);
                    pivot.add(petalMesh);
                    flowerHeadGroup.add(pivot);

                    petals.push({
                        mesh: petalMesh,
                        targetTilt: layer.tilt,
                        targetScale: layer.scale,
                        delay: layerIdx * 140 + i * 16
                    });
                }
            });

            // Floating Pollen Particles
            const particleCount = 150;
            const particleGeo = new THREE.BufferGeometry();
            const particlePositions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i += 3) {
                particlePositions[i] = (Math.random() - 0.5) * 10;
                particlePositions[i + 1] = (Math.random() - 0.5) * 10;
                particlePositions[i + 2] = (Math.random() - 0.5) * 10;
            }

            particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

            const createParticleTexture = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 64;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');
                const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
                grad.addColorStop(0, 'rgba(255, 255, 220, 1)');
                grad.addColorStop(0.35, 'rgba(255, 215, 0, 0.75)');
                grad.addColorStop(0.7, 'rgba(255, 150, 0, 0.2)');
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 64, 64);
                return new THREE.CanvasTexture(canvas);
            };

            const particleMat = new THREE.PointsMaterial({
                size: 0.28,
                map: createParticleTexture(),
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const particles = new THREE.Points(particleGeo, particleMat);
            scene.add(particles);

            function updateLayoutAndCamera() {
                const width = container.clientWidth;
                const height = container.clientHeight;

                if (width === 0 || height === 0) return;

                renderer.setSize(width, height);
                camera.aspect = width / height;

                // Adjust scale and position to be perfectly centered in the middle container
                const aspect = width / height;
                
                if (aspect < 0.8) {
                    // Portrait mobile screens
                    camera.position.set(0, 0, 11.5);
                    sunflowerGroup.position.set(0, -1.0, 0);
                    sunflowerGroup.scale.set(0.65, 0.65, 0.65);
                } else if (aspect < 1.3) {
                    // Tablets / square viewports
                    camera.position.set(0, 0, 10.5);
                    sunflowerGroup.position.set(0, -1.1, 0);
                    sunflowerGroup.scale.set(0.75, 0.75, 0.75);
                } else {
                    // Widescreen desktops
                    camera.position.set(0, 0, 9.5);
                    sunflowerGroup.position.set(0, -1.2, 0);
                    sunflowerGroup.scale.set(0.85, 0.85, 0.85);
                }

                camera.updateProjectionMatrix();
            }

            window.addEventListener('resize', updateLayoutAndCamera);
            updateLayoutAndCamera();

            function triggerBloom() {
                petals.forEach(p => {
                    p.mesh.rotation.x = -1.15;
                    p.mesh.scale.set(0.05, 0.05, 0.05);
                });

                petals.forEach(p => {
                    new TWEEN.Tween(p.mesh.rotation)
                        .to({ x: p.targetTilt }, 1800)
                        .delay(p.delay)
                        .easing(TWEEN.Easing.Back.Out)
                        .start();

                    new TWEEN.Tween(p.mesh.scale)
                        .to({ x: p.targetScale, y: p.targetScale, z: p.targetScale }, 1500)
                        .delay(p.delay)
                        .easing(TWEEN.Easing.Cubic.Out)
                        .start();
                });
            }

            triggerBloom();

            // Dragging interactions restricted to middle container
            let isDragging = false;
            let previousMouse = { x: 0, y: 0 };
            let targetRotY = 0;
            let targetRotX = 0;

            const onStart = (e) => {
                isDragging = true;
                previousMouse = {
                    x: e.clientX || (e.touches && e.touches[0].clientX),
                    y: e.clientY || (e.touches && e.touches[0].clientY)
                };
            };

            const onMove = (e) => {
                if (!isDragging) return;
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);

                const deltaX = clientX - previousMouse.x;
                const deltaY = clientY - previousMouse.y;

                targetRotY += deltaX * 0.007;
                targetRotX += deltaY * 0.005;

                targetRotX = Math.max(-0.35, Math.min(0.35, targetRotX));
                previousMouse = { x: clientX, y: clientY };
            };

            const onEnd = () => { isDragging = false; };

            container.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);

            container.addEventListener('touchstart', onStart, { passive: true });
            window.addEventListener('touchmove', onMove, { passive: true });
            window.addEventListener('touchend', onEnd);

            // Button Event Listeners
            document.getElementById('bloom-btn').addEventListener('click', triggerBloom);

            document.getElementById('light-btn').addEventListener('click', () => {
                new TWEEN.Tween(sunLight)
                    .to({ intensity: 7.5 }, 450)
                    .yoyo(true)
                    .repeat(1)
                    .easing(TWEEN.Easing.Quadratic.Out)
                    .start();

                new TWEEN.Tween(centerGlow)
                    .to({ intensity: 4.5 }, 450)
                    .yoyo(true)
                    .repeat(1)
                    .start();
            });

            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);
                TWEEN.update();

                const time = clock.getElapsedTime();

                // Gentle natural swaying
                flowerHeadGroup.rotation.z = Math.sin(time * 0.8) * 0.025;

                // Inertial rotation
                sunflowerGroup.rotation.y += (targetRotY - sunflowerGroup.rotation.y) * 0.05;
                sunflowerGroup.rotation.x += (targetRotX - sunflowerGroup.rotation.x) * 0.05;

                if (!isDragging) {
                    targetRotY += 0.0025;
                }

                // Floating pollen particles upward movement
                const pos = particles.geometry.attributes.position.array;
                for (let i = 1; i < particleCount * 3; i += 3) {
                    pos[i] += Math.sin(time + i) * 0.0025 + 0.002;
                    if (pos[i] > 5) pos[i] = -5;
                }
                particles.geometry.attributes.position.needsUpdate = true;

                renderer.render(scene, camera);
            }

            animate();
        };
    </script>
</body>
</html>
